[project]
name = "callgrade"
version = "0.1.0"
description = "Regression tests for phone agents: replay calls, score them with checks and an LLM judge, fail CI when quality drops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
callgrade = "callgrade.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
